# Dip Buyer: db, api, worker, web.
# Ports bind to 127.0.0.1 only; expose the web port through Tailscale or Cloudflare Access.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dipbuyer
      POSTGRES_PASSWORD: dipbuyer
      POSTGRES_DB: dipbuyer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipbuyer -d dipbuyer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Runs migrations, then serves the API.
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn dipbuyer.api.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      api:
        condition: service_healthy  # migrations have run
    command: ["python", "-m", "dipbuyer.worker"]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pgdata:
